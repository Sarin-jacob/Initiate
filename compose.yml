version: '3.8'

services:
  nexus-central:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus_central
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # =======================================
      # CORE CONFIGURATION
      # =======================================
      - BASE_URL=http://localhost:8080
      - DB_PATH=/app/data/nexus.db
      
      # =======================================
      # SECURITY & AUTHENTICATION
      # =======================================
      - ADMIN_PASSWORD=changeme123
      - JWT_SECRET=generate_a_random_secure_string_here
      
      # =======================================
      # GITEA INTEGRATION
      # =======================================
      # If Gitea is in this compose file, use http://gitea:3000
      - GITEA_INTERNAL_URL=http://gitea:3000
      - GITEA_ADMIN_TOKEN=your_gitea_api_token
      
      # =======================================
      # EMAIL (SMTP)
      # =======================================
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=your_email@gmail.com
      - SMTP_PASS=your_app_password
      - SMTP_FROM=Nexus Admin <your_email@gmail.com>

    volumes:
      # Persists the SQLite database across container rebuilds
      - nexus_data:/app/data
      
    networks:
      - nexus_net

volumes:
  nexus_data:
    name: nexus_persistent_data

networks:
  nexus_net:
    name: nexus_network
    driver: bridge